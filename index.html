<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopLite — Интернет-магазин электроники</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="top-bar">
    <div class="bar-inner">
      <span>Need help? Call us 112233344455</span>
      <span>Summer sale discount off 60% off! <a href="#">Shop Now</a></span>
      <span>2-3 business days delivery & free returns</span>
    </div>
  </div>

  <div class="main-header">
    <div class=" main-inner">

      <!-- Логотип -->
      <a href="#" class="logo">
        <img src="img/ShopLite-Logo.svg" alt="Логотоп ShopLite" class="logo-img" width="165" height="40">
      </a>

      <!-- Меню навигации -->
      <nav class="main-nav">
        <ul class="nav-list">
          <li><a href="#">HOME</a></li>
          <li><a href="#">ABOUT</a></li>
          <li><a href="#">SHOP</a></li>
          <li><a href="#">BLOGS</a></li>
          <li><a href="#">PAGES</a></li>
          <li><a href="#">CONTACT</a></li>
        </ul>
      </nav>

      <div class="header-actions">
        <a aria-label="Search" class="icon-btn">
          <img src="img/search.svg" alt="иконка поиска" class="search-img" width="24" height="24">
        </a>
        <a aria-label="User Profile" class="icon-btn">
          <img src="img/user.svg" alt="иконка профиля" class="user-img" width="24" height="24">
        </a>
        <a aria-label="Wishlist" class="icon-btn">
          <img src="img/favourites.svg" alt="иконка избраного" class="favour-img" width="24" height="24">
        </a>
        <a aria-label="Cart" class="icon-btn cart-btn">
          <img src="img/basket.svg" alt="иконка корзины" class="basket-img" width="24" height="24">
        </a>
      </div>

    </div>
  </div>

</header>

<main></main>

<footer></footer>
</body>
</html>
